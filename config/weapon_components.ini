; GTA5 Vanilla Weapon Components Addon Configuration
; ==================================================

[Global]
; Enable/Disable the entire addon
Enabled=true

; Log level: 0=None, 1=Error, 2=Warning, 3=Info, 4=Debug
LogLevel=3

; Resource paths
ResourcePath=common:\data\clothes\laser\

[LaserSight]
; Laser sight configuration for all weapons
Enabled=true

; Beam properties
BeamLength=50.0
BeamWidth=2.0

; Laser color (RGB values 0.0 to 1.0)
LaserRed=1.0
LaserGreen=0.0
LaserBlue=0.0

; Laser alpha (opacity 0.0 to 1.0)
LaserAlpha=1.0

; Effect and texture files
LaserBeamEffect=laserbeam.fxc
LaserNoiseTexture=laser_noise.dds

[Weapons]
; Weapon model configurations
; Format: ModelName=Enabled|BeamLength|BeamWidth|LaserR|LaserG|LaserB|LaserA

; Pistol with flashlight variant 2
w_at_pi_flsh_2=true|50.0|2.0|1.0|0.0|0.0|1.0

; Pistol with flashlight variant 3
w_at_pi_flsh_3=true|50.0|2.0|1.0|0.0|0.0|1.0

; Rifle of assault with flashlight variant 3
w_at_ar_flsh_3=true|75.0|2.5|1.0|0.0|0.0|1.0

[Advanced]
; Advanced settings for laser sight behavior

; Enable laser sight in first-person view
FirstPersonEnabled=true

; Enable laser sight in third-person view
ThirdPersonEnabled=true

; Laser sight range (maximum distance)
LaserRange=200.0

; Update frequency (frames per update)
UpdateFrequency=1

; Performance mode: enable for lower end systems
PerformanceMode=false

; Debug mode: enables additional logging
DebugMode=false
